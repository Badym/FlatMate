{#- Przełącznik jasny/ciemny. Style: css/components/theme-toggle.css, JS: js/components/theme-toggle.js -#}
{% macro theme_toggle() -%}
<button type="button" class="btn btn-ghost btn-icon fm-theme-toggle" data-fm-theme-toggle aria-label="Przełącz jasny lub ciemny motyw">

</button>
{%- endmacro %}
