# Nakładka deweloperska: serwer Flaska z przeładowaniem i kodem montowanym z dysku.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  web:
    build:
      target: test
    command: ["sh", "-c", "flask --app wsgi db upgrade && flask --app wsgi run --debug --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    read_only: false
