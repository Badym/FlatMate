<!doctype html>
<html lang="pl" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="FlatMate – uczciwy podział obowiązków w mieszkaniu współdzielonym: zadania cykliczne z rotacją, pula do wzięcia, punkty i wspólny kalendarz.">
  <title>{% block title %}FlatMate – menedżer mieszkania współdzielonego{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <a class="visually-hidden-focusable fm-skip-link" href="#main">Przejdź do treści</a>

  {% block navbar %}{% include "partials/navbar.html" %}{% endblock %}

  <main id="main">
    {% include "partials/flash.html" %}
    {% block content %}{% endblock %}
  </main>

  {% block footer %}{% include "partials/footer.html" %}{% endblock %}

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
