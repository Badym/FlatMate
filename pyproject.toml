[project]
name = "flatmate"
version = "0.1.0"
description = "FlatMate – menedżer mieszkania współdzielonego"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.6",
    "flask-migrate>=4.1.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "email-validator>=2.3.0",
    "flask-limiter>=4.1.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.3.6",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.uv]
# Aplikacja, a nie biblioteka: uv instaluje tylko zależności, bez budowania pakietu.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
